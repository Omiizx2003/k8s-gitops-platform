replicaCount: 2

image:
  repository: 343980058896.dkr.ecr.ap-south-1.amazonaws.com/frontend
  pullPolicy: IfNotPresent
  tag: "1.0"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: frontend.example.com
      paths:
        - path: /
          pathType: Prefix

httpRoute:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 50

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
